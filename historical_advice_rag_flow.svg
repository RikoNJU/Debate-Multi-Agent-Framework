"'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">直接返回空结果</text><line x1="620.0" y1="396" x2="620.0" y2="428" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" /><polygon points="620.0,420.0 780.0,462 620.0,504.0 460.0,462" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" /><text x="620.0" y="443.8" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">逐个</text><text x="620.0" y="462.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">confirmed finding</text><text x="620.0" y="480.2" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">(信号量并发 ≤ 2)</text><line x1="620.0" y1="504" x2="620.0" y2="540" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" /><rect x="320" y="540" width="600" height="58" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2" /><text x="620.0" y="560.8" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">路由集合：格式关键词 → format，否则 → content</text><text x="620.0" y="582.8" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">构造查询：Dense ≤4000 字 · BM25 ≤1000 字</text><line x1="620.0" y1="598" x2="620.0" y2="636" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" /><rect x="60" y="636" width="360" height="152" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" /><text x="240.0" y="662.8" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Dense Top5</text><text x="240.0" y="688.8" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Qwen3-Embedding-8B</text><text x="240.0" y="714.8" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">带指令前缀 → HTTP 嵌入</text><text x="240.0" y="740.8" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">ChromaDB 余弦检索</text><text x="240.0" y="766.8" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">可选 paper_type 过滤/prefer</text><rect x="440" y="636" width="360" height="152" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2" /><text x="620.0" y="662.8" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">构造查询字段</text><text x="620.0" y="688.8" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">标题·类型·评审维度·问题</text><text x="620.0" y="714.8" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">严重程度·章节阶段·位置</text><text x="620.0" y="740.8" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">确认理由·论文证据</text><text x="620.0" y="766.8" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">局部上下文(≤800)</text><rect x="820" y="636" width="360" height="152" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2" /><text x="1000.0" y="662.8" font-size="14" font-weight="bold" fill="#854d0e" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">BM25 Top5</text><text x="1000.0" y="688.8" font-size="14" font-weight="bold" fill="#854d0e" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">jieba 分词</text><text x="1000.0" y="714.8" font-size="14" font-weight="bold" fill="#854d0e" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">BM25 打分 → Top5(score&gt;0)</text><text x="1000.0" y="740.8" font-size="14" font-weight="bold" fill="#854d0e" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">可选 paper_type 前置重排</text><text x="1000.0" y="766.8" font-size="14" font-weight="bold" fill="#854d0e" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">索引：content/format_bm25.pkl</text><line x1="240" y1="788" x2="498" y2="858" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowhead)" /><text x="280" y="846" font-size="12" font-weight="normal" fill="#1d4ed8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">dense hits</text><line x1="1000" y1="788" x2="742" y2="858" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrowhead)" /><text x="930" y="846" font-size="12" font-weight="normal" fill="#ca8a04" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">bm25 hits</text><text x="100" y="824" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">任一支失败 → 记 warning 并降级，不影响整体</text><rect x="340" y="908" width="560" height="58" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" /><text x="620.0" y="928.3" font-size="14" font-weight="bold" fill="#312e81" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">RRF 融合 → Top3</text><text x="620.0" y="951.3" font-size="14" font-weight="bold" fill="#312e81" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">dense: 0.55/(60+rank) + bm25: 0.45/(60+rank) · prefer 类型可加权</text><line x1="620.0" y1="966" x2="620.0" y2="1002" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" /><rect x="340" y="1002" width="560" height="58" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2" /><text x="620.0" y="1021.8" font-size="14" font-weight="bold" fill="#831843" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">Qwen3-Reranker-0.6B 重排</text><text x="620.0" y="1045.8" font-size="14" font-weight="bold" fill="#831843" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">阈值 ≥ 6.0 过滤（失败则仅按 RRF 排序）</text><line x1="620.0" y1="1060" x2="620.0" y2="1096" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" /><rect x="340" y="1096" width="560" height="58" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2" /><text x="620.0" y="1115.8" font-size="14" font-weight="bold" fill="#164e63" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">组装 FindingAdviceItem</text><text x="620.0" y="1139.8" font-size="14" font-weight="bold" fill="#164e63" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">dense/bm25 名次 · rrf/rerank 分 · rerank 理由 · 来源集合</text><line x1="620.0" y1="1154" x2="620.0" y2="1190" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" /><rect x="340" y="1190" width="560" height="52" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2" /><text x="620.0" y="1207.8" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">相似去重(token 重叠 ≥ 0.85) → 每 finding 至多 2 条</text><text x="620.0" y="1229.8" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">按 rerank 分降序</text><line x1="620.0" y1="1242" x2="620.0" y2="1278" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" /><rect x="320" y="1278" width="600" height="62" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" /><text x="620.0" y="1300.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">汇总全部 finding → 历史建议列表</text><text x="620.0" y="1324.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">写入评审报告的修改建议区</text><text x="620.0" y="1374" font-size="12" font-weight="normal" fill="#64748b" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">关键参数(env)：DEBATE_V2_MODE=off|shadow_v2|v2 · TopK dense=5 · bm25=5 · rrf=3 · max_advice_per_finding=2 · 超时120s · 并发2 · rerank阈值6</text><text x="620.0" y="1414" font-size="13" font-weight="normal" fill="#9ca3af" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">索引构建(离线)：历史评审语料清洗 → 向量入库(content/format 两集合) + BM25 索引 + manifest 指纹</text></svg>