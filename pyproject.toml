[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-multi-agent-framework"
version = "0.1.0"
description = "LangGraph framework for evidence-grounded multi-agent paper review debate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
]
web = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
debate-demo = "debate_agent_framework.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src", "."]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["backend/src", "."]
testpaths = ["tests"]
addopts = "-q"
